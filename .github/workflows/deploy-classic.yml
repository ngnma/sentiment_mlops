name: Deploy Classic ML Model

on:
  push:
    branches: [main]
    paths:
      - 'classic_ml/**'
      - 'infra/classic_ml/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-classic.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest classic_ml/tests/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            -t ${{ steps.ecr-login.outputs.registry }}/sentiment-classic:latest \
            -f classic_ml/Dockerfile . --load
          docker push ${{ steps.ecr-login.outputs.registry }}/sentiment-classic:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        working-directory: infra/classic_ml
        run: |
          terraform init
          terraform apply -auto-approve